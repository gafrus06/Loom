server:
  port: 9511


spring:
  cache:
    type: redis
    redis:
      time-to-live: 1h
      cache-null-values: false
      key-prefix: "user-service:"
    data:
      redis:
        host: localhost
        port: 6370
        password: root
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5434/userdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    # На проде заменить на реальный hostname/IP
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
kafka:
  bootstrap-servers: localhost:9092
  consumer:
    group-id: user-service
    auto-offset-reset: earliest



topics:
  phoneVerificationStart: user.phone.verification.start
jakarta:
  persistence:
    validation:
      mode: auto

logging:
  level:
    org.springframework.cache: TRACE
    org.springframework.data.redis: DEBUG
    org.springframework.security: DEBUG
    ru.fun.userservice.config.AppConfig: DEBUG