server:
  port: 9522

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5436/notificationdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: localhost
      port: 6379
kafka:
  bootstrap-servers: localhost:9092
  consumer:
    group-id: notification-service
    auto-offset-reset: earliest
internal-auth:
  secret: ${INTERNAL_AUTH_SECRET:dev-internal-secret}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    # На проде заменить на реальный hostname/IP
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
topics:
  phoneVerificationStart: user.phone.verification.start
  internalNotificationRequested: notification.internal.requested

otp:
  ttl-seconds: 300
  code-length: 4
  charset: digits

