server:
  port: 12717

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
          max-request-body-size: 524288000   # 500 МБ — для загрузки видео

          routes:
            # Fallback — без CircuitBreaker, иначе петля
            - id: fallback-route
              uri: http://localhost:12717
              predicates:
                - Path=/fallback
              filters:
                - StripPrefix=0

            # ─────────────────────────────────────────────────────────────────
            # AUTH SERVICE
            # ─────────────────────────────────────────────────────────────────
            - id: auth-subscription
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/subscription/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: auth-cb
                    fallbackUri: forward:/fallback

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: auth-cb
                    fallbackUri: forward:/fallback

            # ─────────────────────────────────────────────────────────────────
            # NEWS FEED SERVICE
            # ─────────────────────────────────────────────────────────────────
            - id: news-feed-service
              uri: lb://news-feed-service
              predicates:
                - Path=/api/feed/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: news-feed-cb
                    fallbackUri: forward:/fallback
              metadata:
                response-timeout: 120000
                connect-timeout: 5000

            # ─────────────────────────────────────────────────────────────────
            # USER SERVICE
            # ─────────────────────────────────────────────────────────────────
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: user-cb
                    fallbackUri: forward:/fallback

            # ─────────────────────────────────────────────────────────────────
            # FILE STORAGE SERVICE
            # ─────────────────────────────────────────────────────────────────
            - id: file-storage-service
              uri: lb://file-storage-service
              predicates:
                - Path=/api/files/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: file-cb
                    fallbackUri: forward:/fallback

            # ─────────────────────────────────────────────────────────────────
            # NOTIFICATION SERVICE
            # ─────────────────────────────────────────────────────────────────
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: notification-cb
                    fallbackUri: forward:/fallback

            # ─────────────────────────────────────────────────────────────────
            # CAMP SERVICE — Core
            # ─────────────────────────────────────────────────────────────────
            - id: camp-service-camps
              uri: lb://camp-service
              predicates:
                - Path=/api/camps/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: camp-cb
                    fallbackUri: forward:/fallback

            - id: camp-service-sessions
              uri: lb://camp-service
              predicates:
                - Path=/api/sessions/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: camp-cb
                    fallbackUri: forward:/fallback

            - id: camp-service-detachments
              uri: lb://camp-service
              predicates:
                - Path=/api/detachments/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: camp-cb
                    fallbackUri: forward:/fallback

            - id: camp-service-children
              uri: lb://camp-service
              predicates:
                - Path=/api/children/**
              filters:
                - StripPrefix=0
                - name: CircuitBreaker
                  args:
                    name: camp-cb
                    fallbackUri: forward:/fallback

            - id: camp-service-memberships
              uri: lb://camp-service
              predicates:
                - Path=/api/memberships/**
              filters:
