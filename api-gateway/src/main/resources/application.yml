jwt:
  secret: ${JWT_SECRET:c2VjcmV0Y2hhbmdlLW1lLWRldi1zZWNyZXQtZm9yLWxvY2FsLTAxMjM0NTY3ODkw}

app:
  gateway:
    public-paths:
      - /api/auth/login
      - /api/auth/register
      - /api/auth/refresh
      - /api/auth/logout
      - /api/auth/subscription/webhook
      - /actuator/health

rate-limit:
  replenish-rate: 100
  burst-capacity: 300

internal-auth:
  secret: ${INTERNAL_AUTH_SECRET:dev-internal-secret}
  token-version-cache:
    ttl-seconds: 5
    max-size: 10000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    # Кэш реестра обновляется каждые 5 секунд (по умолчанию 30)
    registry-fetch-interval-seconds: 5
  instance:
    # Heartbeat каждые 5 секунд (по умолчанию 30)
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 15s
    instances:
      news-feed-cb:
        timeout-duration: 120s   # загрузка видео может занять до 2 минут

  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 70
        wait-duration-in-open-state: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        minimumNumberOfCalls: 15
        register-health-indicator: true
        record-exceptions:
          - java.io.IOException
          - java.net.ConnectException
          - org.springframework.web.reactive.function.client.WebClientRequestException
    instances:
      auth-cb:
        base-config: default
      news-feed-cb:
        base-config: default
      user-cb:
        base-config: default
      file-cb:
        base-config: default
      notification-cb:
        base-config: default
      camp-cb:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
