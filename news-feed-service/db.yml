version: '3.8'

services:
  news-db:
    image: postgres:17
    container_name: newsdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: news_feed_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5440:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

volumes:
  auth-db-data:
