server:
  port: 9513

spring:
  application:
    name: file-storage-service
  datasource:
    url: jdbc:postgresql://localhost:5435/filedb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# jwt.secret убран — сервис больше не парсит JWT

